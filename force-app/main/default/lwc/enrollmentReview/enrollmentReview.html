<template>
    <lightning-card title="Enrollment Review" icon-name="standard:case">
        <!-- Step 1: Upload -->
        <template lwc:if={isUploadStep}>
            <div class="slds-p-around_medium">
                <p class="slds-text-body_regular slds-m-bottom_medium">
                    Upload an enrollment document to begin AI-assisted extraction.
                </p>
                <c-enrollment-file-upload onfileupload={handleFileUpload}></c-enrollment-file-upload>
            </div>
        </template>

        <!-- Step 2: AI is reading the document -->
        <template lwc:if={isExtractingStep}>
            <c-ai-reading-indicator file-name={fileName}></c-ai-reading-indicator>
        </template>

        <!-- Step 3: Possible existing patient -->
        <template lwc:if={isMatchStep}>
            <div class="slds-p-around_medium">
                <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                    <h2 class="slds-text-heading_small slds-m-bottom_x-small">
                        <lightning-icon icon-name="utility:user" size="x-small"
                            class="slds-m-right_x-small"></lightning-icon>
                        {matchHeading}
                    </h2>
                    <p class="slds-text-body_small slds-text-color_weak">
                        On the form: {formPatientLabel}
                    </p>
                    <p class="slds-text-body_small slds-m-top_x-small">
                        Adding a plan to an existing patient keeps one record per person. Only create
                        a new patient if none of these is the same person.
                    </p>
                </div>

                <template for:each={decoratedMatches} for:item="match">
                    <article key={match.patientId} class="slds-box slds-m-bottom_small match-card">
                        <div class="slds-grid slds-grid_align-spread slds-wrap">
                            <div>
                                <h3 class="slds-text-heading_small">
                                    {match.name}
                                    <lightning-badge label={match.strength}
                                        class={match.strengthCss}></lightning-badge>
                                </h3>
                                <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                    {match.reasonText}
                                </p>
                                <dl class="slds-m-top_x-small slds-text-body_small">
                                    <template lwc:if={match.email}>
                                        <div>Email: {match.email}</div>
                                    </template>
                                    <template lwc:if={match.birthdate}>
                                        <div>Date of birth: {match.birthdate}</div>
                                    </template>
                                    <template lwc:if={match.city}>
                                        <div>City: {match.city}</div>
                                    </template>
                                </dl>
                            </div>
                            <div>
                                <lightning-button label="View Record" data-patient-id={match.patientId}
                                    onclick={handleViewMatchedPatient}
                                    class="slds-m-bottom_x-small"></lightning-button>
                            </div>
                        </div>

                        <template lwc:if={match.hasPlans}>
                            <div class="slds-m-top_small">
                                <p class="slds-text-title_caps slds-m-bottom_xx-small">Existing support plans</p>
                                <ul class="slds-list_dotted slds-text-body_small">
                                    <template for:each={match.planItems} for:item="plan">
                                        <li key={plan.key}>{plan.label}</li>
                                    </template>
                                </ul>
                            </div>
                        </template>

                        <div class="slds-m-top_small">
                            <template lwc:if={match.canEnroll}>
                                <lightning-button variant="brand"
                                    label="Add New Support Plan to This Patient"
                                    data-patient-id={match.patientId}
                                    onclick={handleSelectExistingPatient}></lightning-button>
                            </template>
                            <template lwc:else>
                                <div class="slds-text-color_error slds-text-body_small">
                                    <lightning-icon icon-name="utility:error" size="xx-small"
                                        variant="error" class="slds-m-right_xx-small"></lightning-icon>
                                    {match.blockedReason}
                                </div>
                            </template>
                        </div>
                    </article>
                </template>

                <div class="slds-m-top_medium slds-grid slds-grid_align-end">
                    <lightning-button label="Cancel" onclick={handleBack}
                        class="slds-m-right_small"></lightning-button>
                    <lightning-button label="None of These — Create a New Patient"
                        onclick={handleCreateNewPatient}></lightning-button>
                </div>
            </div>
        </template>

        <!-- Step 4: Review Extracted Data -->
        <template lwc:if={isReviewStep}>
            <div class="slds-p-around_medium">
                <!-- Provenance -->
                <template lwc:if={extractionSummary}>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
                        {extractionSummary}
                    </p>
                </template>
                <template lwc:if={isMockExtraction}>
                    <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_medium" role="alert">
                        This is sample data, not a reading of your document.
                    </div>
                </template>

                <!-- Enrolling into an existing patient -->
                <template lwc:if={selectedPatientBanner}>
                    <div class="slds-box slds-theme_info slds-m-bottom_medium slds-text-body_small">
                        <lightning-icon icon-name="utility:info" size="x-small" variant="inverse"
                            class="slds-m-right_x-small"></lightning-icon>
                        {selectedPatientBanner}
                    </div>
                </template>

                <!-- Warnings, listed one per line -->
                <template lwc:if={hasWarnings}>
                    <div class="slds-box warning-panel slds-m-bottom_medium" role="alert">
                        <p class="slds-text-title_bold slds-m-bottom_x-small">
                            <lightning-icon icon-name="utility:warning" size="x-small"
                                class="slds-m-right_x-small"></lightning-icon>
                            {warningHeading}
                        </p>
                        <ol class="warning-list">
                            <template for:each={warningItems} for:item="warning">
                                <li key={warning.key} class="warning-list__item">
                                    <span class="warning-list__number">{warning.position}</span>
                                    <span class="warning-list__text">{warning.text}</span>
                                </li>
                            </template>
                        </ol>
                    </div>
                </template>

                <!-- What the reviewer changed -->
                <template lwc:if={hasEdits}>
                    <div class="slds-box slds-theme_shade slds-m-bottom_medium slds-text-body_small">
                        <lightning-icon icon-name="utility:edit" size="x-small"
                            class="slds-m-right_x-small"></lightning-icon>
                        {editSummary}
                    </div>
                </template>

                <!-- Document Details -->
                <div class="slds-section slds-is-open slds-m-bottom_medium">
                    <h3 class="slds-section__title">
                        <span class="slds-truncate slds-p-horizontal_small">Document Details</span>
                    </h3>
                    <div class="slds-section__content slds-p-around_small">
                        <template lwc:if={extraction.documentType}>
                            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
                                Identified as: {extraction.documentType}
                            </p>
                        </template>
                        <lightning-layout multiple-rows>
                            <lightning-layout-item size="4" padding="around-small">
                                <div class={fieldClass.externalReferenceNumber}>
                                    <lightning-input label="Form Reference Number"
                                        value={extraction.externalReferenceNumber}
                                        onchange={handleFieldChange}
                                        data-field="externalReferenceNumber"></lightning-input>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="4" padding="around-small">
                                <div class={fieldClass.enrollmentDate}>
                                    <lightning-input type="date" label="Date Received"
                                        value={extraction.enrollmentDate}
                                        onchange={handleFieldChange}
                                        data-field="enrollmentDate"></lightning-input>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="4" padding="around-small">
                                <div class={fieldClass.enrollmentSource}>
                                    <lightning-combobox label="Enrollment Source"
                                        value={extraction.enrollmentSource}
                                        options={enrollmentSourceOptions}
                                        onchange={handleFieldChange}
                                        data-field="enrollmentSource"></lightning-combobox>
                                </div>
                            </lightning-layout-item>
                        </lightning-layout>
                    </div>
                </div>

                <!-- Patient Information -->
                <div class="slds-section slds-is-open slds-m-bottom_medium">
                    <h3 class="slds-section__title">
                        <span class="slds-truncate slds-p-horizontal_small">
                            Patient Information
                            <lightning-badge label={patientConfidenceLabel} class={patientConfidenceCss}></lightning-badge>
                        </span>
                    </h3>
                    <div class="slds-section__content slds-p-around_small">
                        <lightning-layout multiple-rows>
                            <lightning-layout-item size="6" padding="around-small">
                                <div class={fieldClass.firstName}>
                                    <lightning-input label="First Name" value={extraction.firstName}
                                        onchange={handleFieldChange} data-field="firstName"></lightning-input>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="6" padding="around-small">
                                <div class={fieldClass.lastName}>
                                    <lightning-input label="Last Name" value={extraction.lastName}
                                        onchange={handleFieldChange} data-field="lastName" required></lightning-input>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="6" padding="around-small">
                                <div class={fieldClass.dateOfBirth}>
                                    <lightning-input type="date" label="Date of Birth" value={extraction.dateOfBirth}
                                        onchange={handleFieldChange} data-field="dateOfBirth"></lightning-input>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="6" padding="around-small">
                                <div class={fieldClass.phone}>
                                    <lightning-input label="Phone" value={extraction.phone}
                                        onchange={handleFieldChange} data-field="phone"></lightning-input>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" padding="around-small">
                                <div class={fieldClass.email}>
                                    <lightning-input type="email" label="Email" value={extraction.email}
                                        onchange={handleFieldChange} data-field="email"></lightning-input>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" padding="around-small">
                                <div class={fieldClass.street}>
                                    <lightning-input label="Street" value={extraction.street}
                                        onchange={handleFieldChange} data-field="street"></lightning-input>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="3" padding="around-small">
                                <div class={fieldClass.city}>
                                    <lightning-input label="City" value={extraction.city}
                                        onchange={handleFieldChange} data-field="city"></lightning-input>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="3" padding="around-small">
                                <div class={fieldClass.state}>
                                    <lightning-input label="State" value={extraction.state}
                                        onchange={handleFieldChange} data-field="state"
                                        max-length="2"></lightning-input>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="3" padding="around-small">
                                <div class={fieldClass.postalCode}>
                                    <lightning-input label="Postal Code" value={extraction.postalCode}
                                        onchange={handleFieldChange} data-field="postalCode"></lightning-input>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="3" padding="around-small">
                                <div class={fieldClass.country}>
                                    <lightning-input label="Country" value={extraction.country}
                                        onchange={handleFieldChange} data-field="country"
                                        placeholder="US"></lightning-input>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="6" padding="around-small">
                                <div class={fieldClass.preferredLanguage}>
                                    <lightning-combobox label="Preferred Language" value={extraction.preferredLanguage}
                                        options={languageOptions} onchange={handleFieldChange}
                                        data-field="preferredLanguage"></lightning-combobox>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="6" padding="around-small">
                                <div class={fieldClass.communicationPreference}>
                                    <lightning-combobox label="Communication Preference"
                                        value={extraction.communicationPreference}
                                        options={communicationOptions} onchange={handleFieldChange}
                                        data-field="communicationPreference"></lightning-combobox>
                                </div>
                            </lightning-layout-item>
                        </lightning-layout>
                    </div>
                </div>

                <!-- HCP Information -->
                <div class="slds-section slds-is-open slds-m-bottom_medium">
                    <h3 class="slds-section__title">
                        <span class="slds-truncate slds-p-horizontal_small">
                            Prescribing Physician
                            <lightning-badge label={hcpConfidenceLabel} class={hcpConfidenceCss}></lightning-badge>
                        </span>
                    </h3>
                    <div class="slds-section__content slds-p-around_small">
                        <lightning-layout multiple-rows>
                            <lightning-layout-item size="3" padding="around-small">
                                <div class={fieldClass.hcpFirstName}>
                                    <lightning-input label="HCP First Name" value={extraction.hcpFirstName}
                                        onchange={handleFieldChange} data-field="hcpFirstName"></lightning-input>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="3" padding="around-small">
                                <div class={fieldClass.hcpLastName}>
                                    <lightning-input label="HCP Last Name" value={extraction.hcpLastName}
                                        onchange={handleFieldChange} data-field="hcpLastName"></lightning-input>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="3" padding="around-small">
                                <div class={fieldClass.hcpNpi}>
                                    <lightning-input label="NPI Number" value={extraction.hcpNpi}
                                        onchange={handleFieldChange} data-field="hcpNpi"
                                        field-level-help="Ten digits. Left blank when the form's value is not a valid NPI."></lightning-input>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="3" padding="around-small">
                                <div class={fieldClass.hcpSpecialty}>
                                    <lightning-combobox label="Specialty" value={extraction.hcpSpecialty}
                                        options={specialtyOptions} onchange={handleFieldChange}
                                        data-field="hcpSpecialty"></lightning-combobox>
                                </div>
                            </lightning-layout-item>
                        </lightning-layout>
                    </div>
                </div>

                <!-- HCO Information -->
                <div class="slds-section slds-is-open slds-m-bottom_medium">
                    <h3 class="slds-section__title">
                        <span class="slds-truncate slds-p-horizontal_small">Treatment Facility</span>
                    </h3>
                    <div class="slds-section__content slds-p-around_small">
                        <lightning-layout multiple-rows>
                            <lightning-layout-item size="6" padding="around-small">
                                <div class={fieldClass.hcoName}>
                                    <lightning-input label="Facility Name" value={extraction.hcoName}
                                        onchange={handleFieldChange} data-field="hcoName"></lightning-input>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="3" padding="around-small">
                                <div class={fieldClass.hcoSiteType}>
                                    <lightning-combobox label="Site Type" value={extraction.hcoSiteType}
                                        options={siteTypeOptions} onchange={handleFieldChange}
                                        data-field="hcoSiteType"></lightning-combobox>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="3" padding="around-small">
                                <div class={fieldClass.hcoTaxId}>
                                    <lightning-input label="Tax ID" value={extraction.hcoTaxId}
                                        onchange={handleFieldChange} data-field="hcoTaxId"></lightning-input>
                                </div>
                            </lightning-layout-item>
                        </lightning-layout>
                    </div>
                </div>

                <!-- Program Information -->
                <div class="slds-section slds-is-open slds-m-bottom_medium">
                    <h3 class="slds-section__title">
                        <span class="slds-truncate slds-p-horizontal_small">
                            Care Program
                            <lightning-badge label={programConfidenceLabel} class={programConfidenceCss}></lightning-badge>
                        </span>
                    </h3>
                    <div class="slds-section__content slds-p-around_small">
                        <template lwc:if={unmatchedProgramCode}>
                            <p class="slds-text-body_small slds-text-color_error slds-m-bottom_x-small">
                                The form reads "{unmatchedProgramCode}", which is not an active care
                                program here. Select the correct program below.
                            </p>
                        </template>
                        <template lwc:if={programLoadError}>
                            <p class="slds-text-body_small slds-text-color_error slds-m-bottom_x-small">
                                {programLoadError}
                            </p>
                        </template>
                        <lightning-layout multiple-rows>
                            <lightning-layout-item size="6" padding="around-small">
                                <div class={fieldClass.careProgramId}>
                                    <lightning-combobox label="Care Program" required
                                        value={extraction.careProgramId}
                                        options={programOptions}
                                        placeholder="Select a care program"
                                        onchange={handleProgramChange}
                                        field-level-help="The support plan links to this record. Selecting a program fills in the therapy area and product from the program itself."></lightning-combobox>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="6" padding="around-small">
                                <lightning-input label="Program Code" value={extraction.programCode}
                                    readonly></lightning-input>
                            </lightning-layout-item>
                            <lightning-layout-item size="6" padding="around-small">
                                <div class={fieldClass.therapyArea}>
                                    <lightning-input label="Therapy Area" value={extraction.therapyArea}
                                        onchange={handleFieldChange} data-field="therapyArea"></lightning-input>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="6" padding="around-small">
                                <div class={fieldClass.productName}>
                                    <lightning-input label="Product / Drug Name" value={extraction.productName}
                                        onchange={handleFieldChange} data-field="productName"></lightning-input>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" padding="around-small">
                                <div class={fieldClass.servicesRequested}>
                                    <lightning-checkbox-group label="Requested Services"
                                        options={serviceOptions}
                                        value={extraction.servicesRequested}
                                        onchange={handleServicesChange}></lightning-checkbox-group>
                                </div>
                            </lightning-layout-item>
                        </lightning-layout>
                    </div>
                </div>

                <!-- Payer Information -->
                <div class="slds-section slds-is-open slds-m-bottom_medium">
                    <h3 class="slds-section__title">
                        <span class="slds-truncate slds-p-horizontal_small">
                            Payer Information
                            <lightning-badge label={payerConfidenceLabel} class={payerConfidenceCss}></lightning-badge>
                        </span>
                    </h3>
                    <div class="slds-section__content slds-p-around_small">
                        <lightning-layout multiple-rows>
                            <lightning-layout-item size="3" padding="around-small">
                                <div class={fieldClass.payerName}>
                                    <lightning-input label="Payer Name" value={extraction.payerName}
                                        onchange={handleFieldChange} data-field="payerName"></lightning-input>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="3" padding="around-small">
                                <div class={fieldClass.memberId}>
                                    <lightning-input label="Member ID" value={extraction.memberId}
                                        onchange={handleFieldChange} data-field="memberId"></lightning-input>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="3" padding="around-small">
                                <div class={fieldClass.groupNumber}>
                                    <lightning-input label="Group Number" value={extraction.groupNumber}
                                        onchange={handleFieldChange} data-field="groupNumber"></lightning-input>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="3" padding="around-small">
                                <div class={fieldClass.coverageType}>
                                    <lightning-input label="Coverage Type" value={extraction.coverageType}
                                        onchange={handleFieldChange} data-field="coverageType"></lightning-input>
                                </div>
                            </lightning-layout-item>
                        </lightning-layout>
                    </div>
                </div>

                <!-- Consent and Signatures -->
                <div class="slds-section slds-is-open slds-m-bottom_medium">
                    <h3 class="slds-section__title">
                        <span class="slds-truncate slds-p-horizontal_small">Consent &amp; Signatures</span>
                    </h3>
                    <div class="slds-section__content slds-p-around_small">
                        <lightning-layout multiple-rows>
                            <lightning-layout-item size="6" padding="around-small">
                                <div class={fieldClass.patientConsentSigned}>
                                    <lightning-input type="checkbox" label="Patient consent signed"
                                        checked={extraction.patientConsentSigned}
                                        onchange={handleCheckboxChange}
                                        data-field="patientConsentSigned"></lightning-input>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="6" padding="around-small">
                                <div class={fieldClass.prescriberSignaturePresent}>
                                    <lightning-input type="checkbox" label="Prescriber signature present"
                                        checked={extraction.prescriberSignaturePresent}
                                        onchange={handleCheckboxChange}
                                        data-field="prescriberSignaturePresent"></lightning-input>
                                </div>
                            </lightning-layout-item>
                        </lightning-layout>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="slds-m-top_large slds-grid slds-grid_align-end">
                    <template lwc:if={patientMatches.length}>
                        <lightning-button label="Back to Matches" onclick={handleBackToMatches}
                            class="slds-m-right_small"></lightning-button>
                    </template>
                    <lightning-button label="Start Over" onclick={handleBack}
                        class="slds-m-right_small"></lightning-button>
                    <lightning-button variant="destructive" label="Reject" onclick={handleReject}
                        class="slds-m-right_small"></lightning-button>
                    <lightning-button variant="brand" label={confirmLabel} onclick={handleConfirm}
                        disabled={isConfirmDisabled}></lightning-button>
                </div>
            </div>
        </template>

        <!-- Step 5: Success -->
        <template lwc:if={isSuccessStep}>
            <div class="slds-p-around_large slds-align_absolute-center">
                <div class="slds-text-align_center success-panel">
                    <lightning-icon icon-name="action:approval" size="large"
                        class="slds-m-bottom_medium"></lightning-icon>
                    <h2 class="slds-text-heading_medium slds-m-bottom_x-small">{successHeadline}</h2>
                    <p class="slds-text-body_regular slds-m-bottom_x-small">{successDetail}</p>

                    <template lwc:if={enrollmentResult.isNewPatient}>
                        <p class="slds-text-body_small slds-text-color_weak">A new patient record was created.</p>
                    </template>
                    <template lwc:else>
                        <p class="slds-text-body_small slds-text-color_weak">
                            Added to the existing patient — no duplicate record was created.
                        </p>
                    </template>

                    <template lwc:if={syncedFieldsMessage}>
                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                            {syncedFieldsMessage}
                        </p>
                    </template>
                    <template lwc:if={providerSummary}>
                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                            {providerSummary}
                        </p>
                    </template>
                    <template lwc:if={affiliationMessage}>
                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                            {affiliationMessage}
                        </p>
                    </template>
                    <template lwc:if={documentLinkedMessage}>
                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                            {documentLinkedMessage}
                        </p>
                    </template>
                    <template lwc:if={affiliationError}>
                        <div class="slds-box warning-panel slds-m-top_small slds-text-body_small slds-text-align_left">
                            <lightning-icon icon-name="utility:warning" size="x-small"
                                class="slds-m-right_x-small"></lightning-icon>
                            {affiliationError}
                        </div>
                    </template>

                    <div class="slds-m-top_large slds-grid slds-grid_align-center slds-wrap slds-gutters_x-small">
                        <div class="slds-col slds-p-around_xx-small">
                            <lightning-button variant="brand" label="View Patient"
                                icon-name="utility:user" onclick={handleViewPatient}></lightning-button>
                        </div>
                        <div class="slds-col slds-p-around_xx-small">
                            <lightning-button label="View Support Plan"
                                icon-name="utility:case" onclick={handleViewPlan}></lightning-button>
                        </div>
                        <template lwc:if={hasHcp}>
                            <div class="slds-col slds-p-around_xx-small">
                                <lightning-button label="View Prescriber"
                                    icon-name="utility:people" onclick={handleViewPrescriber}></lightning-button>
                            </div>
                        </template>
                        <div class="slds-col slds-p-around_xx-small">
                            <lightning-button label="Start New Enrollment"
                                icon-name="utility:upload" onclick={handleReset}></lightning-button>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- Spinner for everything except extraction, which has its own animation -->
        <template lwc:if={showSpinner}>
            <lightning-spinner alternative-text="Processing..." size="medium"></lightning-spinner>
        </template>
    </lightning-card>
</template>
